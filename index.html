<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mum's Shop">
  <title>Mum's Shopping</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">Mum's Shopping</h1>
    <p id="page-sub" class="sub"></p>
  </header>

  <main id="app"></main>

  <nav class="tabs" aria-label="Pages">
    <a href="#house" data-tab="house"><span class="ico">🏠</span>House</a>
    <a href="#shop" data-tab="shop"><span class="ico">🛒</span>Shop<span id="shop-badge" class="badge" hidden></span></a>
    <a href="#more" data-tab="more"><span class="ico">📋</span>History</a>
  </nav>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2>Edit item</h2>
      <label>Name <input name="name" required autocomplete="off"></label>
      <label>Location in house
        <select name="location"></select>
      </label>
      <label>Aisle (number or name)
        <input name="aisle" list="aisle-list" autocomplete="off" placeholder="e.g. 7 or Bakery">
      </label>
      <div class="dialog-actions">
        <button type="button" class="danger" id="edit-delete">Delete item</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <datalist id="aisle-list"></datalist>

  <script src="app.js"></script>
</body>
</html>
